<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Zone 🧠✨</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="quiz-container">
        <h1>🎯 Test Your Knowledge</h1>
        <div id="question-container">
            <h2 id="question">Loading...</h2>
            <div id="answer-buttons" class="btn-grid"></div>
            <div id="feedback"></div>
        </div>

        <button id="next-btn" class="next-btn">Next ➡️</button>

        <div id="result-container" class="hidden">
            <h2>Your Score 🎉</h2>
            <p id="score"></p>
            <!-- 🔙 Back to Home button -->
            <button onclick="window.location.href='index.html'" class="next-btn">Back 🔙</button>
            <!-- 👤 View Profile button -->
            <button onclick="window.location.href='profile.html'" class="next-btn">View Profile 🧑‍💻</button>
            <!-- 🚪 Logout button -->
            <button id="logoutBtn" class="next-btn">Logout 🚪</button>
        </div>
    </div>

    <script>
        // Logout logic
        document.addEventListener('DOMContentLoaded', function () {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function () {
                    localStorage.clear(); // Clear all stored data
                    window.location.href = 'index.html'; // Redirect to login/signup
                });
            }
        });
    </script>

    <script src="quiz.js"></script>
</body>
</html>
